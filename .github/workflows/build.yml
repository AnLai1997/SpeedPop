name: Build CSBubble (rootless)

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + iOS SDKs
        uses: Randomblock1/theos-action@v1

      - name: Build .deb (release)
        run: |
          set -o pipefail
          if ! make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log; then
            # Dua dong loi len annotation (xem duoc ma khong can dang nhap)
            grep -E "error|Error|fatal|\*\*\*" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Rename .deb
        run: |
          VERSION=$(sed -n 's/^Version: *//p' control)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp packages/*.deb "out/CSBubble_${VERSION}_rootless.deb"
          ls -l out

      - name: List .deb contents
        run: |
          for f in out/*.deb; do
            echo "== $f"
            rm -rf /tmp/deb && mkdir -p /tmp/deb && (cd /tmp/deb && ar x "$GITHUB_WORKSPACE/$f" && tar -tf data.tar.*)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: CSBubble_${{ env.VERSION }}_rootless
          path: out/*.deb

      # Push tag vX.Y.Z (trung Version trong control) -> tao GitHub Release kem file .deb
      - name: Check tag matches control Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME khong khop Version $VERSION trong control"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: CSBubble ${{ env.VERSION }}
          files: out/*.deb
          generate_release_notes: true
